[project]
name = "squint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anshi-kandulna", email = "24je0591@iitism.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "fastapi>=0.143.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "mediapipe>=1.1.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pydantic>=2.14.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
squint = "squint:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
